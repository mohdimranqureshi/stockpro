spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-on-validation-error: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.dealerpro: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  file:
    name: /app/logs/dealerpro.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
