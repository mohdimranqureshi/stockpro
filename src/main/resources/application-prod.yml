spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-on-validation-error: false

server:
  port: ${PORT:8080}

logging:
  level:
    com.dealerpro: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  file:
    name: /app/logs/dealerpro.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
